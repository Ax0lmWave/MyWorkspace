<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA VI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">GTA VI</div>
    <nav class="nav">
      <a href="#">Главная</a>
      <a href="#">Мир</a>
      <a href="#">Персонажи</a>
    </nav>
  </header>

  <main class="hero">
    <p class="eyebrow">Rockstar Games · Vice City</p>
    <h1>Grand Theft Auto VI</h1>
    <p class="subtitle">Вайс-Сити снова зовёт. Криминал, любовь, свобода и хаос.</p>
    <button class="play" type="button">▶ Play</button>

    <div class="countdown">
      <div class="time"><strong id="days">0</strong><span>дн</span></div>
      <div class="time"><strong id="hours">0</strong><span>час</span></div>
      <div class="time"><strong id="minutes">0</strong><span>мин</span></div>
      <div class="time"><strong id="seconds">0</strong><span>сек</span></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
